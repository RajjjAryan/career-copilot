<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Career-Copilot social preview</title>
  <desc id="desc">Career-Copilot helps candidates evaluate jobs, generate tailored CVs, and track applications with AI coding agents.</desc>
  <rect width="1200" height="630" fill="#f5f7f2"/>
  <rect x="64" y="64" width="1072" height="502" rx="10" fill="#111417"/>
  <rect x="96" y="96" width="1008" height="438" rx="8" fill="#192025" stroke="#3c474f" stroke-width="2"/>

  <text x="128" y="170" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="72" font-weight="800" fill="#ffffff">Career-Copilot</text>
  <text x="132" y="226" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" fill="#cfd6dd">AI-powered job search pipeline for candidates</text>

  <rect x="132" y="274" width="265" height="92" rx="8" fill="#23303a"/>
  <text x="158" y="315" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="700" fill="#9cd67b">Evaluate</text>
  <text x="158" y="345" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#e8ecef">Score role fit before applying</text>

  <rect x="436" y="274" width="265" height="92" rx="8" fill="#23303a"/>
  <text x="462" y="315" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="700" fill="#f5c26b">Generate</text>
  <text x="462" y="345" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#e8ecef">Create ATS-ready PDFs</text>

  <rect x="740" y="274" width="265" height="92" rx="8" fill="#23303a"/>
  <text x="766" y="315" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="700" fill="#7fc7ff">Track</text>
  <text x="766" y="345" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#e8ecef">Manage the application funnel</text>

  <text x="132" y="438" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#d7dde3">$ npm run doctor  &&  ask your AI agent to evaluate a job</text>
  <text x="132" y="486" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#aeb8c2">Works with GitHub Copilot CLI, Claude Code, Cursor, Windsurf, Gemini CLI, and Codex.</text>
</svg>
